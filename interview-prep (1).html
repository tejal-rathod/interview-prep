<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Prep — Review Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c;
    --surface:#1b2029;
    --surface-2:#232a37;
    --border:#2a3140;
    --text:#e6e9ef;
    --text-muted:#8b93a3;
    --accent:#5eead4;
    --accent-dim:#2f5f5a;
    --warm:#fbbf24;
    --danger:#f87171;
    --success:#4ade80;
    --java:#f0a860;
    --spring:#7fd67f;
    --micro:#8ab4f8;
    --leet:#e69ad0;
    --sysdesign:#b7a6f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #171c26 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 20px 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header.hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:28px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
  }
  .hero-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .hero-title span{color:var(--accent);}
  .hero-sub{color:var(--text-muted);font-size:14px;margin-top:6px;max-width:520px;line-height:1.5;}
  .hero-date{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text-muted);
    text-align:right;
  }

  /* ---- Dashboard ---- */
  .dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-bottom:30px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 18px;
    position:relative;
    overflow:hidden;
  }
  .stat-card .num{
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
    font-weight:700;
  }
  .stat-card .label{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .stat-card.due .num{color:var(--warm);}
  .stat-card.overdue .num{color:var(--danger);}
  .stat-card.mastered .num{color:var(--success);}

  /* ---- Review Queue (signature element) ---- */
  .queue-section{margin-bottom:36px;}
  .section-heading{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:600;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-heading .count-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:2px 8px;
    border-radius:20px;
    color:var(--text-muted);
  }
  .queue-empty{
    color:var(--text-muted);
    font-size:13.5px;
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:18px;
  }
  .card-stack{display:flex;flex-direction:column;gap:10px;}
  .review-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--topic-color, var(--accent));
    border-radius:8px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .review-card:hover{transform:translateX(2px);}
  .review-card.overdue{border-left-color:var(--danger);}
  .rc-text{font-size:14px;line-height:1.4;flex:1;}
  .rc-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-top:5px;
  }
  .rc-meta.overdue-txt{color:var(--danger);}
  .rc-actions{display:flex;gap:8px;flex-shrink:0;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    border:none;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--accent);color:#0c1613;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);}
  .btn-danger{background:transparent;border:1px solid #4a2b2b;color:var(--danger);}
  .btn-danger:hover{background:#2a1717;opacity:1;}

  .add-form{
    display:flex;gap:10px;margin-bottom:18px;
  }
  .add-form input{
    flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .add-form input::placeholder{color:var(--text-muted);}
  .btn:hover{opacity:.88;}
  .btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---- Tabs ---- */
  .tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:18px;
    border-bottom:1px solid var(--border);
    padding-bottom:0;
  }
  .tab{
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;
    font-weight:600;
    background:none;
    border:none;
    color:var(--text-muted);
    padding:10px 16px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--tab-color);}
  .tab.active{color:var(--text);border-bottom-color:var(--tab-color);}
  .tab .tcount{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-muted);}

  .topic-toolbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:14px;
  }
  .progress-bar{
    flex:1;min-width:160px;height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;
  }
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease;}
  .progress-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap;}

  .filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-chip{
    font-size:11.5px;font-family:'JetBrains Mono',monospace;
    background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
    padding:5px 10px;border-radius:20px;cursor:pointer;
  }
  .filter-chip.active{background:var(--surface-2);color:var(--text);border-color:var(--text-muted);}

  /* ---- Question list ---- */
  .q-list{display:flex;flex-direction:column;gap:8px;}
  .q-item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:13px 15px;
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .q-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .q-index{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--text-muted);
    width:26px;flex-shrink:0;padding-top:2px;
  }
  .q-body{flex:1;min-width:0;}
  .q-text{font-size:13.8px;line-height:1.5;}
  .q-tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center;}
  .status-badge{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    padding:2px 8px;border-radius:20px;border:1px solid var(--border);
  }
  .status-badge.new{color:var(--text-muted);}
  .status-badge.scheduled{color:var(--accent);border-color:var(--accent-dim);}
  .status-badge.mastered{color:var(--success);border-color:#25502f;}
  .status-badge.overdue{color:var(--danger);border-color:#5c2b2b;}
  .status-badge.answered{color:var(--warm);border-color:#6b551c;}
  .q-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}

  .answer-panel{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .answer-panel label{font-size:11px;color:var(--text-muted);margin-top:4px;}
  .answer-panel label:first-child{margin-top:0;}
  .answer-panel textarea{
    width:100%;min-height:80px;resize:vertical;
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;line-height:1.5;
  }
  .answer-panel input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:9px 12px;font-size:13px;font-family:'JetBrains Mono',monospace;
  }
  .answer-link-preview{
    align-self:flex-start;color:var(--accent);text-decoration:none;font-size:12px;
    font-family:'JetBrains Mono',monospace;margin-top:2px;
  }
  .answer-link-preview:hover{text-decoration:underline;}

  /* leetcode form */
  .leet-form{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:16px;margin-bottom:18px;display:grid;grid-template-columns:2fr 1.4fr 1fr auto;gap:10px;align-items:end;
  }
  .leet-form label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:5px;}
  .leet-form input, .leet-form select{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:9px 10px;font-size:13px;font-family:'Inter',sans-serif;
  }
  .diff-tag{font-size:10.5px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:20px;}
  .diff-Easy{color:var(--success);border:1px solid #25502f;}
  .diff-Medium{color:var(--warm);border:1px solid #6b551c;}
  .diff-Hard{color:var(--danger);border:1px solid #5c2b2b;}

  footer{text-align:center;color:var(--text-muted);font-size:11.5px;margin-top:50px;font-family:'JetBrains Mono',monospace;}
  @media (max-width:640px){
    .leet-form{grid-template-columns:1fr;}
    .review-card{flex-direction:column;align-items:flex-start;}
    .rc-actions{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <div class="hero-title">Review <span>Desk</span></div>
      <div class="hero-sub">Java, Spring Boot, Microservices, System Design &amp; LeetCode — 50 senior-level (10+ yrs) questions per section. Mark one done and it comes back to you on day 3, 7, 14, 30 and 90.</div>
    </div>
    <div class="hero-date" id="todayLabel"></div>
  </header>

  <div class="dashboard" id="dashboard"></div>

  <div class="queue-section">
    <div class="section-heading">Due for review <span class="count-pill" id="dueCount">0</span></div>
    <div id="queueArea"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="topicArea"></div>

  <footer>Your progress is saved automatically to this browser session.</footer>
</div>

<script>

  java:{label:'Java', color:'var(--java)'},

  microservices:{label:'Microservices', color:'var(--micro)'},
  systemdesign:{label:'System Design', color:'var(--sysdesign)'},
  leetcode:{label:'LeetCode', color:'var(--leet)'}
};

// ---------- storage helpers ----------
// Uses localStorage so this works as a plain downloaded HTML file opened
// straight from your computer (window.storage only exists inside claude.ai).
function normalizeItem(item){
  if(item.answer===undefined) item.answer='';
  if(item.answerLink===undefined) item.answerLink='';
  return item;
}
function loadProgress(topic, staticList){
  let stored = null;
  try{
    const raw = localStorage.getItem('interview-prep:progress-'+topic);
    stored = raw ? JSON.parse(raw) : null;
  }catch(e){ stored = null; }
  if(stored && Array.isArray(stored) && stored.length > 0) return stored.map(normalizeItem);
  return staticList.map((text,i)=>({
    id: topic+'-'+i, text, status:'new', doneDate:null, stage:0, nextReview:null, answer:'', answerLink:''
  }));
}
function saveProgress(topic, list){
  try{ localStorage.setItem('interview-prep:progress-'+topic, JSON.stringify(list)); }
  catch(e){ console.error('save failed', e); }
}
function loadLeetcode(){
  const seeded = LEETCODE_Q.map((q,i)=>({
    id:'leetcode-'+i, text:q.t, difficulty:q.d,
    url: q.s ? ('https://leetcode.com/problems/'+q.s+'/') : '',
    status:'new', doneDate:null, stage:0, nextReview:null, answer:'', answerLink:''
  }));
  let stored = null;
  try{
    const raw = localStorage.getItem('interview-prep:progress-leetcode');
    stored = raw ? JSON.parse(raw) : null;
  }catch(e){ stored = null; }
  if(stored && Array.isArray(stored) && stored.length > 0) return stored.map(normalizeItem);
  return seeded;
}

// ---------- date helpers ----------
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
}

// ---------- app state ----------
const state = { java:[], springboot:[], microservices:[], systemdesign:[], leetcode:[], activeTab:'java', filter:'all', expanded:new Set() };

function markDone(item){
  item.status = 'scheduled';
  item.doneDate = todayStr();
  item.stage = 0;
  item.nextReview = addDays(item.doneDate, INTERVALS[0]);
}
function markReviewed(item){
  item.stage += 1;
  if(item.stage < INTERVALS.length){
    item.nextReview = addDays(item.doneDate, INTERVALS[item.stage]);
  } else {
    item.status = 'mastered';
    item.nextReview = null;
  }
}
function resetItem(item){
  item.status='new'; item.doneDate=null; item.stage=0; item.nextReview=null;
}

function isDue(item){
  return item.status==='scheduled' && item.nextReview && item.nextReview <= todayStr();
}
function isOverdue(item){
  return isDue(item) && item.nextReview < todayStr();
}

function persist(topic){
  saveProgress(topic, state[topic]);
  render();
}

// ---------- rendering ----------
function allItems(){
  return [
    ...state.java.map(x=>({...x, topic:'java'})),
    ...state.springboot.map(x=>({...x, topic:'springboot'})),
    ...state.microservices.map(x=>({...x, topic:'microservices'})),
    ...state.systemdesign.map(x=>({...x, topic:'systemdesign'})),
    ...state.leetcode.map(x=>({...x, topic:'leetcode'})),
  ];
}

function renderDashboard(){
  const all = allItems();
  const due = all.filter(isDue).length;
  const overdue = all.filter(isOverdue).length;
  const mastered = all.filter(i=>i.status==='mastered').length;
  const total = all.length;
  const dash = document.getElementById('dashboard');
  dash.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total questions</div></div>
    <div class="stat-card due"><div class="num">${due}</div><div class="label">Due for review</div></div>
    <div class="stat-card overdue"><div class="num">${overdue}</div><div class="label">Overdue</div></div>
    <div class="stat-card mastered"><div class="num">${mastered}</div><div class="label">Mastered (90-day done)</div></div>
  `;
  document.getElementById('dueCount').textContent = due;
}

function renderQueue(){
  const all = allItems();
  const due = all.filter(isDue).sort((a,b)=> a.nextReview.localeCompare(b.nextReview));
  const area = document.getElementById('queueArea');
  if(due.length===0){
    area.innerHTML = `<div class="queue-empty">Nothing due right now. Mark questions as read in the tabs below to start their review cycle.</div>`;
    return;
  }
  area.innerHTML = `<div class="card-stack">${due.map(item=>{
    const overdue = isOverdue(item);
    const dayLabel = INTERVALS[item.stage];
    const overdueBy = overdue ? daysBetween(item.nextReview, todayStr()) : 0;
    return `
    <div class="review-card ${overdue?'overdue':''}" style="--topic-color:${TOPIC_META[item.topic].color}">
      <div class="rc-text">
        ${escapeHtml(item.text)}
        <div class="rc-meta ${overdue?'overdue-txt':''}">${TOPIC_META[item.topic].label} · Day ${dayLabel} review ${overdue ? `· overdue ${overdueBy}d` : '· due today'}</div>
      </div>
      <div class="rc-actions">
        <button class="btn btn-primary" data-action="review" data-topic="${item.topic}" data-id="${item.id}">Reviewed</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.keys(TOPIC_META).map(key=>{
    const count = state[key].length;
    return `<button class="tab ${state.activeTab===key?'active':''}" style="--tab-color:${TOPIC_META[key].color}" data-tab="${key}">
      <span class="dot"></span>${TOPIC_META[key].label} <span class="tcount">${count}</span>
    </button>`;
  }).join('');
}

function renderTopicArea(){
  const key = state.activeTab;
  const list = state[key];
  const area = document.getElementById('topicArea');
  const mastered = list.filter(i=>i.status==='mastered').length;
  const pct = list.length ? Math.round((mastered/list.length)*100) : 0;

  let leetForm = '';
  if(key==='leetcode'){
    leetForm = `
    <div class="leet-form">
      <div>
        <label>Problem title</label>
        <input type="text" id="leetTitle" placeholder="e.g. Two Sum">
      </div>
      <div>
        <label>URL (optional)</label>
        <input type="text" id="leetUrl" placeholder="https://leetcode.com/problems/...">
      </div>
      <div>
        <label>Difficulty</label>
        <select id="leetDiff">
          <option>Easy</option><option selected>Medium</option><option>Hard</option>
        </select>
      </div>
      <button class="btn btn-primary" id="addLeetBtn">Add problem</button>
    </div>`;
  } else {
    leetForm = `
    <div class="add-form">
      <input type="text" id="newQText" placeholder="Add a new ${TOPIC_META[key].label} question…">
      <button class="btn btn-primary" id="addQBtn">Add question</button>
    </div>`;
  }

  const filtered = list.filter(item=>{
    if(state.filter==='all') return true;
    if(state.filter==='new') return item.status==='new';
    if(state.filter==='scheduled') return item.status==='scheduled';
    if(state.filter==='mastered') return item.status==='mastered';
    if(state.filter==='due') return isDue(item);
    return true;
  });

  area.innerHTML = `
    ${leetForm}
    <div class="topic-toolbar">
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%;background:${TOPIC_META[key].color}"></div></div>
      <div class="progress-label">${mastered}/${list.length} mastered</div>
    </div>
    <div class="filter-row">
      ${['all','new','scheduled','due','mastered'].map(f=>`<button class="filter-chip ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}
    </div>
    <div class="q-list">
      ${filtered.length ? filtered.map((item,i)=>renderQItem(item,key,list.indexOf(item)+1)).join('') : '<div class="queue-empty">No questions match this filter.</div>'}
    </div>
  `;

  if(key==='leetcode'){
    document.getElementById('addLeetBtn').addEventListener('click', async ()=>{
      const title = document.getElementById('leetTitle').value.trim();
      const url = document.getElementById('leetUrl').value.trim();
      const diff = document.getElementById('leetDiff').value;
      if(!title) return;
      const id = 'leetcode-custom-'+Date.now();
      state.leetcode.push({id, text:title, url, difficulty:diff, status:'new', doneDate:null, stage:0, nextReview:null, answer:'', answerLink:''});
      document.getElementById('leetTitle').value='';
      document.getElementById('leetUrl').value='';
      await persist('leetcode');
    });
  } else {
    const addBtn = document.getElementById('addQBtn');
    const input = document.getElementById('newQText');
    const submit = async ()=>{
      const text = input.value.trim();
      if(!text) return;
      const id = key+'-custom-'+Date.now();
      state[key].push({id, text, status:'new', doneDate:null, stage:0, nextReview:null, answer:'', answerLink:''});
      input.value='';
      await persist(key);
    };
    addBtn.addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  }
}

function renderQItem(item, topic, num){
  let badge = '';
  if(item.status==='new') badge = `<span class="status-badge new">not started</span>`;
  else if(item.status==='mastered') badge = `<span class="status-badge mastered">mastered</span>`;
  else if(isDue(item)) badge = `<span class="status-badge overdue">due · day ${INTERVALS[item.stage]}</span>`;
  else badge = `<span class="status-badge scheduled">next: ${item.nextReview} (day ${INTERVALS[item.stage]})</span>`;

  let diffTag = '';
  if(topic==='leetcode' && item.difficulty){
    diffTag = `<span class="diff-tag diff-${item.difficulty}">${item.difficulty}</span>`;
  }

  const linkPart = (topic==='leetcode' && item.url) ? ` <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">↗ open</a>` : '';

  let actions = '';
  if(item.status==='new'){
    actions = `<button class="btn btn-primary" data-action="done" data-topic="${topic}" data-id="${item.id}">Mark as read</button>`;
  } else if(item.status==='mastered'){
    actions = `<button class="btn btn-ghost" data-action="reset" data-topic="${topic}" data-id="${item.id}">Reset</button>`;
  } else {
    if(isDue(item)){
      actions = `<button class="btn btn-primary" data-action="review" data-topic="${topic}" data-id="${item.id}">Reviewed</button>
                 <button class="btn btn-ghost" data-action="reset" data-topic="${topic}" data-id="${item.id}">Reset</button>`;
    } else {
      actions = `<button class="btn btn-ghost" data-action="reset" data-topic="${topic}" data-id="${item.id}">Reset</button>`;
    }
  }
  actions += `<button class="btn btn-danger" data-action="remove" data-topic="${topic}" data-id="${item.id}" title="Remove this question">Remove</button>`;

  const hasAnswer = (item.answer && item.answer.trim()) || (item.answerLink && item.answerLink.trim());
  const eKey = topic+':'+item.id;
  const isOpen = state.expanded.has(eKey);
  const answerBadge = hasAnswer ? `<span class="status-badge answered">✓ answered</span>` : '';
  const toggleLabel = isOpen ? 'Hide answer' : (hasAnswer ? 'View answer' : 'Add answer');

  const answerPanel = isOpen ? `
    <div class="answer-panel">
      <label>Your answer / notes</label>
      <textarea data-answer-field="answer" data-topic="${topic}" data-id="${item.id}" placeholder="Write your own answer, key points, or notes here…">${escapeHtml(item.answer||'')}</textarea>
      <label>Link (blog post, GitHub repo, docs…)</label>
      <input type="text" data-answer-field="answerLink" data-topic="${topic}" data-id="${item.id}" value="${escapeAttr(item.answerLink||'')}" placeholder="https://...">
      ${item.answerLink ? `<a href="${escapeAttr(item.answerLink)}" target="_blank" rel="noopener" class="answer-link-preview">↗ open saved link</a>` : ''}
    </div>` : '';

  return `
  <div class="q-item">
    <div class="q-row">
      <div class="q-index">${String(num).padStart(2,'0')}</div>
      <div class="q-body">
        <div class="q-text">${escapeHtml(item.text)}${linkPart}</div>
        <div class="q-tags">${badge}${diffTag}${answerBadge}</div>
      </div>
      <div class="q-actions">
        <button class="btn btn-ghost" data-action="toggleAnswer" data-topic="${topic}" data-id="${item.id}">${toggleLabel}</button>
        ${actions}
      </div>
    </div>
    ${answerPanel}
  </div>`;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function render(){
  renderDashboard();
  renderQueue();
  renderTabs();
  renderTopicArea();
}

// ---------- event delegation ----------
document.addEventListener('click', async (e)=>{
  const t = e.target;
  if(t.dataset.action === 'toggleAnswer'){
    const key = t.dataset.topic+':'+t.dataset.id;
    if(state.expanded.has(key)) state.expanded.delete(key); else state.expanded.add(key);
    render();
    return;
  }
  if(t.dataset.action){
    const {action, topic, id} = t.dataset;
    const list = state[topic];
    const item = list.find(i=>i.id===id);
    if(!item) return;
    if(action==='done') markDone(item);
    if(action==='review') markReviewed(item);
    if(action==='reset') resetItem(item);
    if(action==='remove'){
      if(!confirm('Remove this question from the list? This cannot be undone.')) return;
      state[topic] = list.filter(i=>i.id!==id);
      state.expanded.delete(topic+':'+id);
      await persist(topic);
      return;
    }
    await persist(topic);
  }
  if(t.dataset.tab){
    state.activeTab = t.dataset.tab;
    state.filter='all';
    render();
  }
  if(t.dataset.filter){
    state.filter = t.dataset.filter;
    renderTopicArea();
  }
});

// Auto-save answer text / link when the field loses focus (not on every keystroke,
// so re-rendering doesn't yank focus away while typing).
document.addEventListener('focusout', (e)=>{
  const t = e.target;
  const field = t.dataset && t.dataset.answerField;
  if(!field) return;
  const { topic, id } = t.dataset;
  const item = state[topic] && state[topic].find(i=>i.id===id);
  if(!item) return;
  item[field] = t.value;
  saveProgress(topic, state[topic]);
  renderDashboard();
  renderQueue();
  renderTabs();
  renderTopicArea();
});

async function init(){
  document.getElementById('todayLabel').textContent = 'Today · ' + new Date().toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'});
  state.java = await loadProgress('java', JAVA_Q);
  state.springboot = await loadProgress('springboot', SPRING_Q);
  state.microservices = await loadProgress('microservices', MICRO_Q);
  state.systemdesign = await loadProgress('systemdesign', SYSTEMDESIGN_Q);
  state.leetcode = await loadLeetcode();
  render();
}
init();
